[project]
name = "beeflight"
version = "0.1.0"
description = "Orientierungsflug oder Sammelflug? Klassifikation von Flugbahnen junger Bienen vor dem Flugloch (WDS224)"
authors = [{ name = "Florian Dittmann" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "av>=14",
    "huggingface-hub>=0.30",
    "matplotlib>=3.9",
    "numpy>=2.1",
    "opencv-python-headless>=4.10",
    "scipy>=1.14",
]

[project.optional-dependencies]
# trajectory classifier (GRU / 1D-CNN), added once hand labels exist
ml = [
    "scikit-learn>=1.6",
    "torch>=2.5",
]
# bee detector + ByteTrack (Ultralytics), CPU build of torch
detector = ["ultralytics>=8.3", "lap>=0.5.12", "torch>=2.5", "torchvision>=0.20"]

[project.scripts]
beeflight-splits = "beeflight.splits:main"
beeflight-tracks = "beeflight.tracks:main"
beeflight-figures = "beeflight.figures:main"
beeflight-sample = "beeflight.sample:main"
beeflight-clips = "beeflight.clips:main"
beeflight-vote = "beeflight.vote:main"
beeflight-detector = "beeflight.detector:main"
beeflight-sledevic = "beeflight.sledevic:main"
beeflight-sort = "beeflight.sort:main"
beeflight-chiron = "beeflight.chiron:main"
beeflight-pose = "beeflight.pose:main"
beeflight-evaluate = "beeflight.evaluate:main"
beeflight-baselines = "beeflight.baselines:main"
beeflight-resnet = "beeflight.resnet:main"
beeflight-dinov2 = "beeflight.image_features:main"
beeflight-fusion = "beeflight.fusion:main"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beeflight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
